[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# T1 gate runs `cargo clippy --workspace -- -D warnings` (deny via CLI flag; keep lints declarative here)
