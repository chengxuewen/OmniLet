# OmniLet T1 CI (test-matrix.md tier-1): path-filtered gates.
# Red-line mechanics (R1/R2/R3) activate as their surfaces land; this file carries T1 only.
name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  rust:
    if: hashFiles('crates/**') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: pixi-org/setup-pixi@v0.8.8
        with: { pixi-version: v0.77.1, locked: true }
      - run: pixi run cargo clippy --workspace -- -D warnings
      - run: pixi run cargo test --workspace
  js:
    if: hashFiles('compiler/**') != '' || hashFiles('runtime/**') != '' || hashFiles('packages/**') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: pixi-org/setup-pixi@v0.8.8
        with: { pixi-version: v0.77.1, locked: true }
      - run: pixi run pnpm install --frozen-lockfile
      - run: pixi run pnpm -r test
