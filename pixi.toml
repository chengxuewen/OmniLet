# OmniLet dev environment — pixi single-source management (D11, predecessor VisiaEngine D5 same-form)
# Usage: pixi install (first time) -> pixi run <task> or source .pixi/env activation | Verify: pixi run verify
[workspace]
name = "omnilet"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
rust = ">=1.85,<1.86"          # current stable measured at scaffold-time (D11); bump = lockfile migration
nodejs = ">=22"                # solver-resolved (pnpm 11 needs >=24.16; engine floor stays 22 in package.json)
pnpm = ">=11,<12"

[tasks]
verify = { cmd = "rustc --version && cargo --version && node --version && pnpm --version" }
test = { cmd = "cargo test --workspace && pnpm -r test" }
lint = { cmd = "cargo clippy --workspace -- -D warnings" }
