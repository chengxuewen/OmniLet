[package]
name = "omnilet-container"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "omnilet-container"
path = "src/main.rs"

# T1/D18: Linux final-form engine via cef-rs (tauri-apps). no-sandbox is cef-rs's
# default posture; security promises live at the omnilet layer (D8 chain) — stance
# recorded in SDD. wry never returns to Linux (retired per D16; Win/Mac = winmac-wry slice).
[dependencies]
omnilet-render = { path = "../omnilet-render" }
omnilet-webview = { path = "../omnilet-webview" }
omnilet-channel = { path = "../omnilet-channel" }
omnilet-patch = { path = "../omnilet-patch" }
omnilet-jsengine = { path = "../omnilet-jsengine" }
omnilet-protocol = { path = "../omnilet-protocol" }
cef = "154"
winit = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints]
workspace = true
